<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EKAM Football Academy</title>
<meta name="description" content="EKAM Football Academy - Play. Train. Compete.">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06100a;
    color:#fff;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}

/* =====================================================
   COLORS
===================================================== */

:root{
    --green:#19e66b;
    --green2:#0dbb52;
    --dark:#06100a;
    --dark2:#0a170e;
    --card:#0d1d13;
    --white:#ffffff;
    --muted:#9eafa3;
    --line:rgba(255,255,255,.09);
}

/* =====================================================
   SCROLL ANIMATION
===================================================== */

.reveal{
    opacity:0;
    transform:translateY(60px);
    transition:
        opacity .8s ease,
        transform .8s ease;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

.reveal-left{
    opacity:0;
    transform:translateX(-70px);
    transition:
        opacity .8s ease,
        transform .8s ease;
}

.reveal-left.show{
    opacity:1;
    transform:translateX(0);
}

.reveal-right{
    opacity:0;
    transform:translateX(70px);
    transition:
        opacity .8s ease,
        transform .8s ease;
}

.reveal-right.show{
    opacity:1;
    transform:translateX(0);
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;
    background:rgba(4,12,7,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(25,230,107,.12);
}

.navbar{
    max-width:1250px;
    height:78px;
    margin:auto;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo img{
    width:48px;
    height:48px;
    object-fit:contain;
    border-radius:12px;
}

.logo span{
    color:var(--green);
}

.nav-links{
    display:flex;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:#dce7df;
    font-size:14px;
    font-weight:600;
    position:relative;
    padding:8px 0;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:2px;
    background:var(--green);
    transition:.3s;
}

.nav-links a:hover{
    color:var(--green);
}

.nav-links a:hover::after{
    width:100%;
}

.nav-book{
    padding:12px 20px;
    border-radius:30px;
    background:var(--green);
    color:#031007 !important;
    font-weight:900 !important;
}

.nav-book::after{
    display:none;
}

.menu-btn{
    display:none;
    width:45px;
    height:45px;
    border:1px solid var(--line);
    border-radius:12px;
    align-items:center;
    justify-content:center;
    font-size:24px;
    cursor:pointer;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;
    padding:130px 25px 90px;

    display:flex;
    align-items:center;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(3,12,6,.98) 0%,
            rgba(3,12,6,.82) 45%,
            rgba(3,12,6,.35) 100%
        ),
        url("https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=2000&q=90")
        center/cover no-repeat;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:var(--green);
    filter:blur(180px);
    opacity:.13;
    right:-150px;
    top:100px;
}

.hero-content{
    max-width:1250px;
    width:100%;
    margin:auto;
    position:relative;
    z-index:2;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;
    border:1px solid rgba(25,230,107,.35);
    background:rgba(25,230,107,.08);
    color:var(--green);
    border-radius:30px;

    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;

    margin-bottom:22px;
}

.live-dot{
    width:8px;
    height:8px;
    background:var(--green);
    border-radius:50%;
    box-shadow:0 0 15px var(--green);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }
    50%{
        transform:scale(1.5);
        opacity:.5;
    }
}

.hero h1{
    font-size:clamp(55px,10vw,115px);
    line-height:.88;
    font-weight:950;
    letter-spacing:-6px;
    max-width:850px;
}

.hero h1 span{
    color:var(--green);
}

.hero-description{
    max-width:580px;
    color:#c4d0c8;
    font-size:18px;
    line-height:1.7;
    margin:28px 0;
}

.hero-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    padding:15px 24px;
    border-radius:12px;

    font-weight:800;
    font-size:14px;

    border:1px solid transparent;
    transition:.3s;
    cursor:pointer;
}

.btn-green{
    background:var(--green);
    color:#031007;
    box-shadow:0 10px 30px rgba(25,230,107,.15);
}

.btn-green:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(25,230,107,.3);
}

.btn-outline{
    border-color:rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:white;
    backdrop-filter:blur(10px);
}

.btn-outline:hover{
    border-color:var(--green);
    color:var(--green);
    transform:translateY(-4px);
}

/* =====================================================
   HERO STATS
===================================================== */

.hero-stats{
    margin-top:55px;
    display:flex;
    gap:45px;
    flex-wrap:wrap;
}

.stat strong{
    display:block;
    color:var(--green);
    font-size:30px;
    font-weight:900;
}

.stat span{
    color:#9eaaa2;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* =====================================================
   SECTION
===================================================== */

section{
    padding:110px 25px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.section-label{
    color:var(--green);
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.section-title{
    font-size:clamp(35px,5vw,62px);
    line-height:1;
    letter-spacing:-2px;
    margin-bottom:18px;
}

.section-text{
    color:var(--muted);
    line-height:1.7;
    max-width:650px;
}

/* =====================================================
   ABOUT
===================================================== */

.about{
    background:#07130b;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-image{
    position:relative;
}

.about-image img{
    width:100%;
    height:500px;
    object-fit:cover;
    border-radius:30px;
    border:1px solid var(--line);
}

.about-badge{
    position:absolute;
    right:-25px;
    bottom:25px;

    padding:22px;
    background:#0d1e13;
    border:1px solid rgba(25,230,107,.25);
    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.about-badge strong{
    display:block;
    color:var(--green);
    font-size:30px;
}

.about-badge span{
    color:#9da99f;
    font-size:12px;
}

.about-content p{
    color:#aebbb2;
    line-height:1.8;
    margin:20px 0 30px;
}

.features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.feature{
    padding:20px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:17px;
    transition:.3s;
}

.feature:hover{
    transform:translateY(-5px);
    border-color:rgba(25,230,107,.35);
}

.feature-icon{
    font-size:25px;
    margin-bottom:10px;
}

.feature strong{
    display:block;
    margin-bottom:5px;
}

.feature span{
    color:#87968b;
    font-size:12px;
}

/* =====================================================
   SERVICES
===================================================== */

.services{
    background:
        radial-gradient(circle at 20% 20%,rgba(25,230,107,.08),transparent 30%),
        #06100a;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:45px;
}

.card{
    padding:30px;
    min-height:220px;

    background:linear-gradient(
        145deg,
        #102318,
        #09140d
    );

    border:1px solid var(--line);
    border-radius:22px;

    transition:.35s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    background:var(--green);
    filter:blur(80px);
    opacity:0;
    right:-20px;
    top:-20px;
    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(25,230,107,.4);
}

.card:hover::before{
    opacity:.25;
}

.card-icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;
    background:rgba(25,230,107,.1);
    border:1px solid rgba(25,230,107,.2);

    font-size:25px;
    margin-bottom:25px;
}

.card h3{
    margin-bottom:10px;
    font-size:19px;
}

.card p{
    color:#8d9d92;
    line-height:1.6;
    font-size:13px;
}

/* =====================================================
   GALLERY
===================================================== */

.gallery-section{
    background:#07130b;
}

.gallery{
    margin-top:45px;

    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    grid-template-rows:250px 250px;
    gap:12px;
}

.gallery-item{
    overflow:hidden;
    border-radius:20px;
    border:1px solid var(--line);
}

.gallery-item:first-child{
    grid-row:span 2;
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

/* =====================================================
   REVIEWS
===================================================== */

.reviews{
    background:#06100a;
}

.rating-box{
    display:flex;
    align-items:center;
    gap:20px;
    margin:35px 0;
}

.rating-number{
    font-size:60px;
    font-weight:950;
    color:white;
}

.stars{
    color:#ffd43b;
    font-size:20px;
    letter-spacing:2px;
}

.review-count{
    color:#718078;
    font-size:13px;
    margin-top:5px;
}

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.review{
    padding:27px;
    background:#0c1a11;
    border:1px solid var(--line);
    border-radius:20px;
}

.review-user{
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
}

.review-name{
    font-weight:800;
}

.review-date{
    color:#68766d;
    font-size:11px;
}

.review p{
    color:#9ba99f;
    line-height:1.7;
    font-size:13px;
}

/* =====================================================
   BOOKING
===================================================== */

.booking{
    background:
        linear-gradient(
            rgba(3,12,6,.88),
            rgba(3,12,6,.97)
        ),
        url("https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=1800&q=90")
        center/cover;
}

.booking-box{
    max-width:750px;
    margin:45px auto 0;

    padding:35px;

    background:rgba(8,20,12,.88);
    backdrop-filter:blur(20px);

    border:1px solid rgba(25,230,107,.2);
    border-radius:28px;

    box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:17px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    color:#b9c5bd;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:15px;

    background:#061009;
    color:white;

    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;

    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(25,230,107,.08);
}

.submit-btn{
    width:100%;
    border:none;
}

/* =====================================================
   LOCATION
===================================================== */

.location{
    background:#07130b;
}

.location-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:45px;
}

.location-card{
    padding:30px;
    background:#0d1c12;
    border:1px solid var(--line);
    border-radius:22px;
}

.location-card h3{
    margin-bottom:15px;
}

.location-card p{
    color:#929f96;
    line-height:1.8;
    margin-bottom:20px;
}

.location-list{
    display:grid;
    gap:13px;
}

.location-list div{
    padding:13px;
    border-radius:12px;
    background:#09150d;
    color:#adb9b0;
    font-size:13px;
}

.location-list span{
    color:var(--green);
    margin-right:8px;
}

.map{
    min-height:330px;
    border-radius:22px;

    background:
        linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.7)),
        url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1200&q=85")
        center/cover;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =====================================================
   CTA
===================================================== */

.cta{
    padding:80px 25px;
    background:
        radial-gradient(circle at center,rgba(25,230,107,.16),transparent 45%),
        #06100a;
    text-align:center;
}

.cta h2{
    font-size:clamp(35px,6vw,65px);
    margin-bottom:15px;
}

.cta p{
    color:#87968c;
    margin-bottom:25px;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#030805;
    padding:45px 25px;
    border-top:1px solid var(--line);
}

.footer-inner{
    max-width:1150px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.footer-logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}

.footer-logo img{
    width:40px;
    height:40px;
    object-fit:contain;
    border-radius:10px;
}

.footer-logo span{
    color:var(--green);
}

footer p{
    color:#617066;
    font-size:12px;
}

.social{
    display:flex;
    gap:9px;
}

.social a{
    width:40px;
    height:40px;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0d1a11;
    border:1px solid var(--line);

    transition:.3s;
}

.social a:hover{
    background:var(--green);
    color:#031007;
    transform:translateY(-4px);
}

/* =====================================================
   TOP BUTTON
===================================================== */

.top-btn{
    position:fixed;
    right:20px;
    bottom:20px;

    width:48px;
    height:48px;

    border:none;
    border-radius:15px;

    background:var(--green);
    color:#031007;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    opacity:0;
    pointer-events:none;

    transition:.3s;
    z-index:999;
}

.top-btn.show{
    opacity:1;
    pointer-events:auto;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    .nav-links{
        position:absolute;
        top:78px;
        left:15px;
        right:15px;

        display:none;
        flex-direction:column;
        gap:5px;

        padding:15px;

        background:#08150c;
        border:1px solid rgba(25,230,107,.15);
        border-radius:18px;

        box-shadow:0 20px 50px rgba(0,0,0,.5);
    }

    .nav-links.active{
        display:flex;
    }

    .nav-links a{
        display:block;
        padding:14px;
    }

    .nav-book{
        text-align:center;
    }

    .menu-btn{
        display:flex;
    }

    .hero{
        background:
            linear-gradient(
                rgba(3,12,6,.9),
                rgba(3,12,6,.97)
            ),
            url("https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=1500&q=85")
            center/cover;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .about-grid,
    .location-grid{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .review-grid{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:1fr 1fr;
        grid-template-rows:200px 200px 200px;
    }

    .gallery-item:first-child{
        grid-column:span 2;
        grid-row:span 1;
    }

    .footer-inner{
        flex-direction:column;
        text-align:center;
    }
}

@media(max-width:550px){

    section{
        padding:80px 18px;
    }

    .navbar{
        padding:0 18px;
    }

    .logo{
        font-size:18px;
    }

    .logo img{
        width:42px;
        height:42px;
    }

    .hero{
        padding-left:18px;
        padding-right:18px;
    }

    .hero h1{
        font-size:58px;
    }

    .hero-description{
        font-size:15px;
    }

    .hero-stats{
        gap:25px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .features{
        grid-template-columns:1fr;
    }

    .about-image img{
        height:380px;
    }

    .about-badge{
        right:12px;
        bottom:15px;
    }

    .gallery{
        grid-template-columns:1fr;
        grid-template-rows:220px 180px 180px 180px 180px;
    }

    .gallery-item:first-child{
        grid-column:span 1;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .booking-box{
        padding:22px;
    }

    .rating-number{
        font-size:48px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

<nav class="navbar">

    <a href="#home" class="logo">
        <img src="logo.png" alt="EKAM Football Academy Logo">
        <div>EKAM <span>FOOTBALL</span></div>
    </a>

    <ul class="nav-links" id="navLinks">

        <li>
            <a href="#home" onclick="closeMenu()">Home</a>
        </li>

        <li>
            <a href="#about" onclick="closeMenu()">About</a>
        </li>

        <li>
            <a href="#services" onclick="closeMenu()">Services</a>
        </li>

        <li>
            <a href="#gallery" onclick="closeMenu()">Gallery</a>
        </li>

        <li>
            <a href="#reviews" onclick="closeMenu()">Reviews</a>
        </li>

        <li>
            <a href="#booking" class="nav-book" onclick="closeMenu()">Book Now</a>
        </li>

    </ul>

    <div class="menu-btn" onclick="toggleMenu()" id="menuBtn">
        ☰
    </div>

</nav>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero" id="home">

<div class="hero-content">

    <div class="hero-tag">
        <span class="live-dot"></span>
        EKAM FOOTBALL ACADEMY
    </div>

    <h1>
        PLAY.<br>
        <span>COMPETE.</span><br>
        REPEAT.
    </h1>

    <p class="hero-description">
        Welcome to EKAM — a place for football lovers,
        teams and friends to train, compete and enjoy
        the beautiful game.
    </p>

    <div class="hero-buttons">

        <a href="#booki
